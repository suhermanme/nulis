[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
  "apps/desktop/src-tauri",
  "benchmarks",
  "crates/nulis-automation",
  "crates/nulis-core",
  "crates/nulis-diff",
  "crates/nulis-document",
  "crates/nulis-filesystem",
  "crates/nulis-hex",
  "crates/nulis-language",
  "crates/nulis-lsp",
  "crates/nulis-large-file",
  "crates/nulis-platform",
  "crates/nulis-plugin-host",
  "crates/nulis-print",
  "crates/nulis-search",
  "crates/nulis-settings",
  "crates/nulis-syntax",
  "crates/nulis-terminal",
  "crates/nulis-theme",
]

[workspace.package]
version = "0.5.4"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/suhermanme/nulis"
rust-version = "1.90"

[workspace.dependencies]
base64 = "=0.23.1"
boa_engine = { version = "=0.20.0", default-features = false }
portable-pty = "=0.9.0"
regex = "1.13"
regex-syntax = "0.8"
rhai = { version = "=1.27.0", features = ["sync", "no_closure", "no_custom_syntax", "no_function", "no_index", "no_module", "no_object"] }
rustix = { version = "=1.1.5", features = ["process"] }
semver = "=1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
tauri = { version = "2.1", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-single-instance = "=2.5.4"
tempfile = "3.23.0"
thiserror = "2.0"
tree-sitter = "=0.24.7"
tree-sitter-json = "=0.24.8"
tree-sitter-python = "=0.23.6"
unicode-segmentation = "=1.13.3"
yaml-rust2 = { version = "=0.13.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
