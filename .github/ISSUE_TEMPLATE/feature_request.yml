name: Feature request
description: Suggest something Nulis should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or situation, rather than the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working in Nulis.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, or how another tool does it. Describe the behavior; Nulis is an original implementation and copies no other editor's code or assets (docs/CLEAN_ROOM.md).
