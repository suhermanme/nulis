[package]
name = "nulis-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "nulis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
nulis-core = { path = "../../../crates/nulis-core" }
nulis-plugin-host = { path = "../../../crates/nulis-plugin-host" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPrintInfo"] }

[lints]
workspace = true
